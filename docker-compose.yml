services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-incident-postgres
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mcp-server:
    image: enterprise-incident-mcp:latest
    container_name: enterprise-incident-mcp
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://incident_user:incident_password@postgres:5432/incident_db
      PYTHONPATH: /app/src
    restart: unless-stopped

volumes:
  postgres_data: